[package]
name = "mintd"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rand = "0.10"
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
png = "0.17"
proto = { path = "../proto" }
overstory-render = { path = "../render" }
secp256k1 = "0.33"
zcash_protocol = "=0.11.0-pre.0"
zcash_transparent = "=0.11.0-pre.1"

sha2 = "0.10"
