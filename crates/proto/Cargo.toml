[package]
name = "proto"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
rand = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
secp256k1 = { version = "0.33", features = ["std", "alloc"] }
zcash_address = "=0.14.0-pre.1"
zcash_protocol = { version = "=0.11.0-pre.0", features = ["local-consensus"] }
zcash_transparent = { version = "=0.11.0-pre.1", features = ["transparent-inputs"] }
zcash_primitives = { version = "=0.31.0-pre.1", features = ["transparent-inputs", "non-standard-fees"] }
pczt = { version = "=0.10.0-pre.1", features = ["transparent", "zcp-builder", "io-finalizer", "signer", "spend-finalizer", "tx-extractor"] }
sha2 = "0.10"
ripemd = "0.1"
sapling = { package = "sapling-crypto", version = "0.9", default-features = false }
orchard = { version = "0.16", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
zcash_script = { version = "=0.6.0", features = ["signature-validation"] }
overstory-sighash = { path = "../sighash-wasm" }

[[example]]
name = "testnet-index"
path = "../../regtest/testnet_index.rs"

[[example]]
name = "mainnet-test-index"
path = "../../regtest/mainnet_index.rs"

[[example]]
name = "recover-single-reveal"
path = "../../regtest/recover_single_reveal.rs"
