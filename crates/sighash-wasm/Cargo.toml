[package]
name = "overstory-sighash"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
hex = "0.4"
secp256k1 = { version = "0.33", features = ["std", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zcash_protocol = { version = "=0.11.0-pre.0", default-features = false, features = ["local-consensus"] }
zcash_transparent = { version = "=0.11.0-pre.1", default-features = false, features = ["transparent-inputs"] }
zcash_primitives = { version = "=0.31.0-pre.1", default-features = false, features = ["std"] }
sapling = { package = "sapling-crypto", version = "0.9", default-features = false }
orchard = { version = "0.16", default-features = false }
getrandom = { version = "0.2", features = ["js"] }
getrandom4 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
